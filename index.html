<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTUC Regression Test Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efe9;
  --text:#1a1a1a;--text2:#5a5a5a;--text3:#9a9a9a;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--border3:rgba(0,0,0,0.28);
  --radius:8px;--radius-lg:12px;
  --pass:#1a7a4a;--pass-bg:#eaf7f0;--pass-border:rgba(26,122,74,0.25);
  --fail:#c0392b;--fail-bg:#fceaea;--fail-border:rgba(192,57,43,0.25);
  --blocked:#b07800;--blocked-bg:#fff8e1;--blocked-border:rgba(176,120,0,0.25);
  --skip:#888;--skip-bg:#f5f5f5;
  --accent:#1a1a1a;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1c;--bg2:#262624;--bg3:#2e2e2b;
    --text:#e8e8e2;--text2:#a8a8a0;--text3:#686860;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--border3:rgba(255,255,255,0.28);
    --pass:#2ecc71;--pass-bg:rgba(46,204,113,0.12);--pass-border:rgba(46,204,113,0.3);
    --fail:#e74c3c;--fail-bg:rgba(231,76,60,0.12);--fail-border:rgba(231,76,60,0.3);
    --blocked:#f39c12;--blocked-bg:rgba(243,156,18,0.12);--blocked-border:rgba(243,156,18,0.3);
    --skip:#666;--skip-bg:rgba(255,255,255,0.05);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--bg2);border-right:0.5px solid var(--border);padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-header{padding:16px 16px 12px;border-bottom:0.5px solid var(--border)}
.sidebar-header h1{font-size:13px;font-weight:600;letter-spacing:-0.2px}
.sidebar-header p{font-size:11px;color:var(--text2);margin-top:2px}
.sidebar-sections{padding:8px 0;flex:1}
.sec-item{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;transition:background 0.12s;gap:8px}
.sec-item:hover{background:var(--bg3)}
.sec-item.active{background:var(--accent);color:#fff}
.sec-item.active .sec-count{color:rgba(255,255,255,0.6)}
.sec-name{font-size:13px;font-weight:500}
.sec-count{font-size:11px;color:var(--text3)}
.sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-fail{background:var(--fail)}
.dot-pass{background:var(--pass)}
.dot-empty{background:var(--border2)}
.sidebar-bottom{padding:12px 16px;border-top:0.5px solid var(--border)}
.sidebar-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini-stat{background:var(--bg3);border-radius:var(--radius);padding:8px;text-align:center}
.mini-stat-val{font-size:18px;font-weight:600}
.mini-stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px}
.val-pass{color:var(--pass)}
.val-fail{color:var(--fail)}
.val-blocked{color:var(--blocked)}

/* Main */
.main{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:15px;font-weight:600}
.env-select{font-size:12px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer}
.tester-input{font-size:12px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);width:140px}
.tester-input::placeholder{color:var(--text3)}
.topbar-right{display:flex;gap:8px;align-items:center}
.progress-wrap{flex:1;max-width:200px;margin:0 16px}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s}
.prog-label{font-size:11px;color:var(--text2);margin-top:3px;text-align:right}

/* Buttons */
.btn{font-size:12px;padding:7px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all 0.12s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(0.98)}
.btn-dark{background:var(--accent);color:var(--bg);border-color:transparent}
.btn-dark:hover{opacity:0.85;background:var(--accent)}
.btn-pass-btn{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-border)}
.btn-pass-btn:hover{filter:brightness(0.95)}
.btn-fail-btn{background:var(--fail-bg);color:var(--fail);border-color:var(--fail-border)}
.btn-fail-btn:hover{filter:brightness(0.95)}
.btn-blocked-btn{background:var(--blocked-bg);color:var(--blocked);border-color:var(--blocked-border)}
.btn-blocked-btn:hover{filter:brightness(0.95)}
.btn-skip-btn{background:var(--skip-bg);color:var(--skip);border-color:var(--border)}
.btn-sm{font-size:11px;padding:4px 10px}

/* Content area */
.content{padding:24px;flex:1}
.view-tabs{display:flex;gap:0;border-bottom:0.5px solid var(--border);margin-bottom:20px}
.vtab{font-size:13px;padding:8px 16px;border-bottom:2px solid transparent;cursor:pointer;color:var(--text2);transition:all 0.12s;margin-bottom:-1px}
.vtab:hover{color:var(--text)}
.vtab.active{color:var(--text);border-bottom-color:var(--accent)}

/* Test case cards */
.tc-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;transition:border-color 0.15s}
.tc-card.current-card{border-color:var(--border3);box-shadow:0 0 0 2px rgba(0,0,0,0.06)}
.tc-card.result-pass{border-left:3px solid var(--pass)}
.tc-card.result-fail{border-left:3px solid var(--fail)}
.tc-card.result-blocked{border-left:3px solid var(--blocked)}
.tc-card.result-skip{opacity:0.55}
.tc-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:12px}
.tc-id-badge{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px}
.tc-scenario{font-size:14px;font-weight:500;line-height:1.4}
.tc-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.status-pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.pill-pass{background:var(--pass-bg);color:var(--pass)}
.pill-fail{background:var(--fail-bg);color:var(--fail)}
.pill-blocked{background:var(--blocked-bg);color:var(--blocked)}
.pill-skip{background:var(--skip-bg);color:var(--skip)}
.pill-pending{background:var(--bg2);color:var(--text3)}
.bug-pill{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(255,150,50,0.12);color:#b05000;border:0.5px solid rgba(176,80,0,0.2)}
.slow-pill{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--blocked-bg);color:var(--blocked)}
.chevron{font-size:12px;color:var(--text3);transition:transform 0.15s}
.chevron.open{transform:rotate(180deg)}
.tc-body{padding:0 16px 16px;border-top:0.5px solid var(--border)}
.tc-data-box{font-size:12px;color:var(--text2);padding:8px 10px;background:var(--bg2);border-radius:var(--radius);margin:12px 0 10px}
.tc-data-box strong{color:var(--text);font-weight:500}
.steps-ol{font-size:13px;color:var(--text2);padding-left:18px;margin-bottom:10px;line-height:1.75}
.steps-ol li{margin-bottom:1px}
.expected-box{font-size:13px;padding:9px 12px;background:rgba(26,122,74,0.06);border-radius:var(--radius);border-left:2px solid var(--pass);margin-bottom:12px;line-height:1.5}
.expected-box .label{font-size:10px;font-weight:600;color:var(--pass);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:3px}
.bug-box{font-size:12px;padding:7px 10px;background:rgba(255,150,50,0.08);border-radius:var(--radius);margin-bottom:10px;color:#b05000;border:0.5px solid rgba(176,80,0,0.15)}
.action-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.reset-btn{margin-left:auto}
.note-textarea{width:100%;font-size:12px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical;min-height:56px;font-family:inherit;transition:border-color 0.12s}
.note-textarea:focus{outline:none;border-color:var(--border3)}

/* Nav */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav-counter{font-size:13px;color:var(--text2)}

/* Webhook validator */
.validator-panel{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-top:16px}
.validator-panel h3{font-size:14px;font-weight:600;margin-bottom:4px}
.validator-panel p{font-size:12px;color:var(--text2);margin-bottom:14px}
.validator-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-group{margin-bottom:12px}
.field-group label{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px}
.webhook-textarea{width:100%;font-size:12px;padding:10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);resize:vertical;height:280px;font-family:monospace;transition:border-color 0.12s}
.webhook-textarea:focus{outline:none;border-color:var(--border3)}
.val-select{font-size:12px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);width:100%;cursor:pointer;font-family:inherit}
.validate-btn{margin-top:8px}
.val-results{margin-top:14px}
.val-result-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:var(--radius);margin-bottom:5px;font-size:12px}
.vri-pass{background:var(--pass-bg)}
.vri-fail{background:var(--fail-bg)}
.vri-warn{background:var(--blocked-bg)}
.vri-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.vri-label{font-weight:500;margin-right:4px}
.vri-val{color:var(--text2)}
.val-summary{font-size:13px;font-weight:500;padding:10px 12px;border-radius:var(--radius);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.vs-pass{background:var(--pass-bg);color:var(--pass)}
.vs-fail{background:var(--fail-bg);color:var(--fail)}

/* Expected result checkboxes */
.expected-checks{margin-bottom:12px}
.expected-checks .label{font-size:10px;font-weight:600;color:var(--pass);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:6px}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:var(--radius);margin-bottom:3px;cursor:pointer;transition:background 0.1s;font-size:13px;color:var(--text2);line-height:1.4;background:rgba(26,122,74,0.04);border:0.5px solid rgba(26,122,74,0.1)}
.check-item:hover{background:rgba(26,122,74,0.09)}
.check-item.checked{background:rgba(26,122,74,0.1);color:var(--text);text-decoration:none}
.check-item.checked .check-text{color:var(--text)}
.check-box{width:15px;height:15px;border:1.5px solid var(--pass-border);border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all 0.12s;background:var(--bg)}
.check-item.checked .check-box{background:var(--pass);border-color:var(--pass)}
.check-tick{color:#fff;font-size:10px;font-weight:700;display:none}
.check-item.checked .check-tick{display:block}
.check-text{flex:1}
.checks-progress{font-size:11px;color:var(--text3);margin-top:4px;margin-bottom:2px}
.webhook-checks{margin-top:8px;padding-top:8px;border-top:0.5px dashed var(--border)}

/* Report modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-box{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border2);width:min(680px,100%);max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:15px;font-weight:600}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:0.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.report-pre{font-family:monospace;font-size:12px;white-space:pre-wrap;background:var(--bg2);padding:14px;border-radius:var(--radius);line-height:1.65;word-break:break-word}
.overall-pill{display:inline-block;font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--radius);margin-bottom:12px}
.op-ready{background:var(--pass-bg);color:var(--pass)}
.op-issues{background:var(--blocked-bg);color:var(--blocked)}
.op-blocked{background:var(--fail-bg);color:var(--fail)}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.35}
.empty-state h3{font-size:15px;font-weight:500;margin-bottom:6px;color:var(--text)}
.empty-state p{font-size:13px}

/* Section done banner */
.done-banner{background:var(--pass-bg);border:0.5px solid var(--pass-border);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:16px}
.done-banner h3{color:var(--pass);font-size:15px;font-weight:600;margin-bottom:4px}
.done-banner p{font-size:13px;color:var(--text2)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .sidebar{height:auto;position:relative}
  .validator-layout{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🛡️ NTUC Regression</h1>
      <p>Pre-deployment test suite</p>
    </div>
    <nav class="sidebar-sections" id="sidebar-nav"></nav>
    <div class="sidebar-bottom">
      <div class="sidebar-stats" id="sidebar-stats"></div>
      <button class="btn btn-dark" style="width:100%;margin-top:10px;justify-content:center" onclick="openReport()">📄 Generate Report</button>
      <button class="btn" style="width:100%;margin-top:6px;justify-content:center;color:var(--fail);border-color:var(--fail-border)" onclick="confirmNewRun()">🔄 New Run</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title" id="topbar-title">PayNow</span>
        <select class="env-select" id="env-select">
          <option value="Dev">Dev</option>
          <option value="Stage">Stage</option>
          <option value="Prod">Prod</option>
          <option value="Dev + Stage">Dev + Stage</option>
          <option value="All Environments">All Environments</option>
        </select>
        <input class="tester-input" id="tester-input" type="text" placeholder="Tester name…" />
      </div>
      <div class="topbar-right">
        <span id="save-indicator" style="font-size:11px;color:var(--pass);opacity:0;transition:opacity 0.3s;margin-right:4px">✓ saved</span>
        <div class="progress-wrap">
          <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
          <div class="prog-label" id="prog-label">0 / 0</div>
        </div>
        <button class="btn btn-dark" onclick="openReport()">📄 Report</button>
      </div>
    </div>

    <div class="content">
      <div class="view-tabs">
        <div class="vtab active" id="tab-run" onclick="setView('run')">▶ Run</div>
        <div class="vtab" id="tab-all" onclick="setView('all')">☰ All Cases</div>
        <div class="vtab" id="tab-webhook" onclick="setView('webhook')">🔗 Webhook Validator</div>
      </div>
      <div id="main-content"></div>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal-overlay" id="report-modal" style="display:none" onclick="if(event.target===this)closeReport()">
  <div class="modal-box">
    <div class="modal-header">
      <h2>📄 Run Report</h2>
      <button class="btn btn-sm" onclick="closeReport()">✕ Close</button>
    </div>
    <div class="modal-body">
      <div id="overall-pill-container"></div>
      <div class="report-pre" id="report-content"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="copyReport()">📋 Copy</button>
      <button class="btn btn-dark" onclick="downloadReport()">⬇ Download .txt</button>
    </div>
  </div>
</div>

<script>
const TEST_DATA = {
  sections: [
    { id:"paynow", name:"ACME PayNow", short:"PayNow",
      cases:[
        {id:"PN-W1",scenario:"Successful one-time payment",data:"OneTime=True, Valid Amount, UEN(SUCCESS): 000000001",steps:["Set ACME credentials on PortOne admin with Success simulation UEN (000000001)","Click Pay → redirected to PortOne checkout","Click QR CODE","Payment succeeds → PortOne success page shown","Banner with timer + manual redirect option visible","Timer hits 0 → auto-redirect to NTUC page"],expected:"Payment is successful|Redirected to success page|Dashboard: transaction status = Success",webhook:"Webhook received|OneTimePaymentStatus = Success|ErrorCode is empty",cbType:"paynow_success"},
        {id:"PN-W2",scenario:"Failed one-time payment",data:"OneTime=True, Valid Amount, UEN(FAILED): 000000002",steps:["Set credentials with Failed simulation UEN (000000002)","Click Pay → checkout → click QR CODE → failure page","Failure reason displayed","Banner + timer → auto-redirect"],expected:"Payment failed|Failure page shown|Redirected to failure page",webhook:"Webhook received|OneTimePaymentStatus = Failed|ErrorCode = 4000",cbType:"paynow_fail"},
        {id:"PN-W3",scenario:"Invalid amount (decimal)",data:"OneTime=True, Invalid decimal amount (e.g. 2.3)",steps:["Click Pay → checkout","Click QR CODE → failure page","Failure reason displayed","Banner + timer → auto-redirect"],expected:"Payment failed|Failure page shown|Redirected to failure page",webhook:"Webhook received|OneTimePaymentStatus = Failed|ErrorCode = 5000",cbType:"paynow_invalid"},
        {id:"PN-W4",scenario:"Payment link expiry",data:"OneTime=True, Valid Amount, UEN: 000000003",steps:["Set non-success/failure UEN (e.g. 000000003)","Click Pay → checkout → click QR CODE","QR loads in ~2 seconds","Wait 20+ minutes for expiry callback"],expected:"Callback received|OneTimePaymentStatus = Cancelled",webhook:"Webhook received (wait 20+ min)|OneTimePaymentStatus = Cancelled|ErrorCode = 4072",slow:true,cbType:"paynow_expire"},
        {id:"PN-W5",cbType:"paynow_success",scenario:"Retry payment on same link",data:"OneTime=True, UEN SUCCESS: 000000001, FAILED: 000000002",steps:["Set Failed UEN → open checkout","Duplicate tab (2nd tab open)","Click QR CODE in 2nd tab → failure page","Switch to Success UEN on admin","Click QR CODE on original tab → success","Callback: Success"],expected:"Payment link accepts multiple attempts|Final successful attempt marked as Success|Callback status = Success",webhook:"Webhook received|OneTimePaymentStatus = Success"},
        {id:"PN-W6",cbType:"paynow_fail",scenario:"Zero amount single payment",data:"OneTime=True, Amount=0",steps:["Click PayNow with amount 0","Should redirect to failure page"],expected:"Redirected to failure page",webhook:"Webhook received|OneTimePaymentStatus = Failed"},
        {id:"PN-W7",cbType:"paynow_success",scenario:"Same link in two browsers",data:"OneTime=True, Valid Amount, UEN: 000000001",steps:["Set non-success UEN → open same link in 2 browsers","Browser 1: click QR CODE → success","Browser 2: click QR CODE"],expected:"Browser 1: payment captured successfully|Browser 2: popup shown|Popup message: A Successful Payment has been captured using this link",webhook:"Webhook received once (not twice)|OneTimePaymentStatus = Success"},
        {id:"PN-W8",scenario:"Payment on cancelled link",data:"OneTime=True, Valid Amount",steps:["Open already-cancelled link → attempt payment"],expected:"Error message shown on checkout|Message: payment link has been cancelled|No payment methods shown"},
        {id:"PN-W9",scenario:"No expiry callback after success",data:"OneTime=True, Valid Amount",steps:["Non-success UEN → 2 tabs → switch to Success UEN → pay in tab 1 → callback: Success","Verify: NO expiry/failure callback arrives afterward"],expected:"Payment marked Success|Callback status = Success received|No expiry or failure callback arrives afterward"},
        {id:"PN-W10",scenario:"Success callback after expired link",data:"OneTime=True, Valid Amount",steps:["Non-success UEN → 2 tabs → wait for expiry callback","Switch to Success UEN → pay → callback: Success"],expected:"Prior expiry callback received|Payment subsequently succeeds|Success callback received"},
        {id:"PN-W11",cbType:"paynow_success",scenario:"Browser closed after success",data:"OneTime=True, Valid Amount",steps:["Click Pay → checkout → click QR CODE","Close browser before redirect","Payment processes successfully"],expected:"Payment marked Success|Callback status = Success",webhook:"Webhook received|OneTimePaymentStatus = Success"},

const LS_KEY = "ntuc_runner_state";

function loadState() {
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      return {
        activeSection: parsed.activeSection || "paynow",
        activeTcIdx: parsed.activeTcIdx || 0,
        view: parsed.view || "run",
        results: parsed.results || {},
        notes: parsed.notes || {},
        expanded: parsed.expanded || {},
        checks: parsed.checks || {},
        valPayload: parsed.valPayload || "",
        valSchema: parsed.valSchema || "paynow_success",
        valResults: null
      };
    }
  } catch(e) {}
  return {
    activeSection: "paynow",
    activeTcIdx: 0,
    view: "run",
    results: {},
    notes: {},
    expanded: {},
    checks: {},
    valPayload: "",
    valSchema: "paynow_success",
    valResults: null
  };
}

function saveState() {
  try {
    const toSave = {
      activeSection: S.activeSection,
      activeTcIdx: S.activeTcIdx,
      view: S.view,
      results: S.results,
      notes: S.notes,
      expanded: S.expanded,
      checks: S.checks,
      valPayload: S.valPayload,
      valSchema: S.valSchema
    };
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
    showSaved();
  } catch(e) {}
}

let S = loadState();

function parseCheckpoints(expected) {
  if (!expected) return [expected];
  if (expected.includes("|")) {
    return expected.split("|").map(p => p.trim()).filter(p => p.length > 1);
  }
  const parts = expected.split(/\. +(?=[A-Z])/).map(p => p.replace(/\.$/, "").trim()).filter(p => p.length > 4);
  return parts.length > 1 ? parts : [expected.replace(/\.$/, "")];
}

function toggleCheck(tcId, idx) {
  if (!S.checks[tcId]) S.checks[tcId] = {};
  S.checks[tcId][idx] = !S.checks[tcId][idx];
  saveState();
  // Re-render just the checks section without full re-render
  const el = document.getElementById("checks-" + tcId);
  if (el) el.outerHTML = renderChecksHtml(tcId, parseCheckpoints(
    TEST_DATA.sections.flatMap(s=>s.cases).find(c=>c.id===tcId)?.expected || ""
  ));
}

function renderChecksHtml(tcId, checkpoints) {
  const tcChecks = S.checks[tcId] || {};
  const checkedCount = Object.values(tcChecks).filter(Boolean).length;
  const total = checkpoints.length;
  
  let html = `<div class="expected-checks" id="checks-${tcId}">`;
  html += `<span class="label">✓ Expected results — verify each</span>`;
  if (total > 1) {
    html += `<div class="checks-progress">${checkedCount}/${total} verified</div>`;
  }
  checkpoints.forEach((point, idx) => {
    const isChecked = !!tcChecks[idx];
    html += `<div class="check-item${isChecked?" checked":""}" onclick="toggleCheck('${tcId}',${idx})">
      <div class="check-box"><span class="check-tick">✓</span></div>
      <span class="check-text">${e(point)}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderWebhookChecksHtml(tcId, wChecks) {
  const key = "w_" + tcId;
  const tcChecks = S.checks[key] || {};
  const checkedCount = Object.values(tcChecks).filter(Boolean).length;
  const total = wChecks.length;
  let html = `<div class="expected-checks webhook-checks" id="wchecks-${tcId}">`;
  html += `<span class="label" style="color:#7c4dcc">🔔 Webhook / Callback check</span>`;
  if (total > 1) html += `<div class="checks-progress">${checkedCount}/${total} verified</div>`;
  wChecks.forEach((point, idx) => {
    const isChecked = !!tcChecks[idx];
    html += `<div class="check-item${isChecked?" checked":""}" style="${isChecked?"background:rgba(124,77,204,0.1);border-color:rgba(124,77,204,0.3)":"background:rgba(124,77,204,0.04);border-color:rgba(124,77,204,0.12)"}" onclick="toggleWebhookCheck('${tcId}',${idx})">
      <div class="check-box" style="${isChecked?"background:#7c4dcc;border-color:#7c4dcc":"border-color:rgba(124,77,204,0.4)"}"><span class="check-tick">✓</span></div>
      <span class="check-text">${e(point)}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function toggleWebhookCheck(tcId, idx) {
  const key = "w_" + tcId;
  if (!S.checks[key]) S.checks[key] = {};
  S.checks[key][idx] = !S.checks[key][idx];
  saveState();
  const el = document.getElementById("wchecks-" + tcId);
  const tc = TEST_DATA.sections.flatMap(s => s.cases).find(c => c.id === tcId);
  if (el && tc && tc.webhook) {
    const wChecks = tc.webhook.split("|").map(p => p.trim()).filter(p => p.length > 1);
    el.outerHTML = renderWebhookChecksHtml(tcId, wChecks);
  }
}

function allCases(){ return TEST_DATA.sections.flatMap(s=>s.cases.map(c=>({...c,sectionId:s.id,sectionName:s.name}))); }
function sectionCases(id){ const s=TEST_DATA.sections.find(x=>x.id===id); return s?s.cases:[]; }
function getSectionStats(id){
  const cases=sectionCases(id);
  return {
    pass:cases.filter(c=>S.results[c.id]==="pass").length,
    fail:cases.filter(c=>S.results[c.id]==="fail").length,
    blocked:cases.filter(c=>S.results[c.id]==="blocked").length,
    skip:cases.filter(c=>S.results[c.id]==="skip").length,
    total:cases.length,
    done:cases.filter(c=>S.results[c.id]).length
  };
}
function getOverallStats(){
  const all=allCases();
  const pass=all.filter(c=>S.results[c.id]==="pass").length;
  const fail=all.filter(c=>S.results[c.id]==="fail").length;
  const blocked=all.filter(c=>S.results[c.id]==="blocked").length;
  const skip=all.filter(c=>S.results[c.id]==="skip").length;
  return {pass,fail,blocked,skip,total:all.length,done:pass+fail+blocked+skip};
}

function e(s){ return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""; }

function renderSidebar(){
  const nav=document.getElementById("sidebar-nav");
  const stats=document.getElementById("sidebar-stats");
  const overall=getOverallStats();
  let navHtml="";
  TEST_DATA.sections.forEach(sec=>{
    const ss=getSectionStats(sec.id);
    const isActive=S.activeSection===sec.id;
    let dotCls="sec-dot dot-empty";
    if(ss.fail>0) dotCls="sec-dot dot-fail";
    else if(ss.done===ss.total&&ss.total>0) dotCls="sec-dot dot-pass";
    navHtml+=`<div class="sec-item ${isActive?"active":""}" onclick="switchSection('${sec.id}')">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="${dotCls}"></div>
        <span class="sec-name">${sec.name}</span>
      </div>
      <span class="sec-count">${ss.done}/${ss.total}${ss.fail>0&&!isActive?` · ${ss.fail}✗`:""}</span>
    </div>`;
  });
  nav.innerHTML=navHtml;
  stats.innerHTML=`
    <div class="mini-stat"><div class="mini-stat-val val-pass">${overall.pass}</div><div class="mini-stat-label">Pass</div></div>
    <div class="mini-stat"><div class="mini-stat-val val-fail">${overall.fail}</div><div class="mini-stat-label">Fail</div></div>
    <div class="mini-stat"><div class="mini-stat-val val-blocked">${overall.blocked}</div><div class="mini-stat-label">Blocked</div></div>
    <div class="mini-stat"><div class="mini-stat-val">${overall.skip}</div><div class="mini-stat-label">Skip</div></div>
  `;
}

function renderTopbar(){
  const overall=getOverallStats();
  const pct=overall.total>0?(overall.done/overall.total*100):0;
  document.getElementById("prog-fill").style.width=pct.toFixed(1)+"%";
  document.getElementById("prog-label").textContent=`${overall.done} / ${overall.total} cases`;
  const sec=TEST_DATA.sections.find(s=>s.id===S.activeSection);
  document.getElementById("topbar-title").textContent=sec?sec.name:"";
  ["tab-run","tab-all","tab-webhook"].forEach(id=>{
    document.getElementById(id).classList.remove("active");
  });
  const tabMap={run:"tab-run",all:"tab-all",webhook:"tab-webhook"};
  if(tabMap[S.view]) document.getElementById(tabMap[S.view]).classList.add("active");
}

function renderMain(){
  const content=document.getElementById("main-content");
  if(S.view==="webhook"){ content.innerHTML=renderWebhook(); attachWebhookEvents(); return; }
  const cases=sectionCases(S.activeSection);
  if(S.view==="run"){
    const tc=cases[S.activeTcIdx];
    if(!tc){
      const ss=getSectionStats(S.activeSection);
      content.innerHTML=`<div class="done-banner"><h3>✅ Section complete!</h3><p>All ${ss.total} test cases in this section are done. Switch to the next section or generate your report.</p></div>`;
      return;
    }
    content.innerHTML=renderTcCard(tc,true)+`<div class="nav-row">
      <button class="btn" onclick="prevCase()" ${S.activeTcIdx===0?"disabled":""} style="opacity:${S.activeTcIdx===0?0.4:1}">← Prev</button>
      <span class="nav-counter">${S.activeTcIdx+1} / ${cases.length}</span>
      <button class="btn" onclick="nextCase()" ${S.activeTcIdx>=cases.length-1?"disabled":""} style="opacity:${S.activeTcIdx>=cases.length-1?0.4:1}">Next →</button>
    </div>`;
  } else {
    content.innerHTML=cases.map((tc,i)=>renderTcCard(tc,false,i)).join("");
  }
}

function renderTcCard(tc, isCurrent){
  const result=S.results[tc.id];
  const note=S.notes[tc.id]||"";
  const expanded=S.expanded[tc.id]!==false;
  let cardCls=`tc-card${isCurrent?" current-card":""}${result?" result-"+result:""}`;
  let pillHtml="";
  if(result==="pass") pillHtml=`<span class="status-pill pill-pass">✓ Pass</span>`;
  else if(result==="fail") pillHtml=`<span class="status-pill pill-fail">✗ Fail</span>`;
  else if(result==="blocked") pillHtml=`<span class="status-pill pill-blocked">⚠ Blocked</span>`;
  else if(result==="skip") pillHtml=`<span class="status-pill pill-skip">— Skip</span>`;
  else pillHtml=`<span class="status-pill pill-pending">Pending</span>`;
  if(tc.knownBug) pillHtml+=` <span class="bug-pill">🐛 known bug</span>`;
  if(tc.slow) pillHtml+=` <span class="slow-pill">⏱ long test</span>`;

  let bodyHtml="";
  if(expanded){
    bodyHtml=`<div class="tc-body">`;
    if(tc.data) bodyHtml+=`<div class="tc-data-box"><strong>Test data:</strong> ${e(tc.data)}</div>`;
    if(tc.steps&&tc.steps.length) bodyHtml+=`<ol class="steps-ol">${tc.steps.map(s=>`<li>${e(s)}</li>`).join("")}</ol>`;
    const checkpoints = parseCheckpoints(tc.expected);
    bodyHtml += renderChecksHtml(tc.id, checkpoints);
    if (tc.webhook) {
      const wChecks = tc.webhook.split("|").map(p => p.trim()).filter(p => p.length > 1);
      bodyHtml += renderWebhookChecksHtml(tc.id, wChecks);
    }
    if(tc.knownBug) bodyHtml+=`<div class="bug-box">🐛 <strong>Known bug:</strong> ${e(tc.knownBug)}</div>`;
    bodyHtml+=`<div class="action-row">
      <button class="btn btn-pass-btn" onclick="setResult('${tc.id}','pass')">✓ Pass</button>
      <button class="btn btn-fail-btn" onclick="setResult('${tc.id}','fail')">✗ Fail</button>
      <button class="btn btn-blocked-btn" onclick="setResult('${tc.id}','blocked')">⚠ Blocked</button>
      <button class="btn btn-skip-btn" onclick="setResult('${tc.id}','skip')">— Skip</button>
      ${result?`<button class="btn btn-sm reset-btn" onclick="clearResult('${tc.id}')">↺ Reset</button>`:""}
    </div>
    <textarea class="note-textarea" placeholder="Notes / deviation details (optional)…" onchange="setNote('${tc.id}',this.value)">${e(note)}</textarea>`;
    if(tc.cbType) bodyHtml+=`<div style="margin-top:10px"><button class="btn btn-sm" onclick="openWebhookForTC('${tc.cbType}')">🔗 Validate webhook for this test →</button></div>`;
    bodyHtml+=`</div>`;
  }

  return `<div class="${cardCls}" id="tc-${tc.id}">
    <div class="tc-card-header" onclick="toggleExpand('${tc.id}')">
      <div>
        <div class="tc-id-badge">${tc.id}</div>
        <div class="tc-scenario">${e(tc.scenario)}</div>
      </div>
      <div class="tc-header-right">
        ${pillHtml}
        <span class="chevron ${expanded?"open":""}">▼</span>
      </div>
    </div>
    ${bodyHtml}
  </div>`;
}

function renderWebhook(){
  const schemaOpts=Object.entries(WEBHOOK_SCHEMAS).map(([k,v])=>`<option value="${k}" ${S.valSchema===k?"selected":""}>${v.label}</option>`).join("");
  let resultsHtml="";
  if(S.valResults){
    const all=S.valResults;
    const failCount=all.filter(r=>r.status==="fail").length;
    const warnCount=all.filter(r=>r.status==="warn").length;
    const summCls=failCount>0?"vs-fail":warnCount>0?"vs-fail":"vs-pass";
    const summMsg=failCount>0?`❌ ${failCount} check(s) failed`:`✅ All checks passed`;
    resultsHtml=`<div class="val-summary ${summCls}">${summMsg} · ${all.length} total checks</div>`;
    resultsHtml+=all.map(r=>{
      const cls=r.status==="pass"?"vri-pass":r.status==="warn"?"vri-warn":"vri-fail";
      const icon=r.status==="pass"?"✓":r.status==="warn"?"⚠":"✗";
      return `<div class="val-result-item ${cls}"><span class="vri-icon">${icon}</span><div><span class="vri-label">${e(r.label)}</span>${r.found!==undefined?`<span class="vri-val">→ found: "${e(String(r.found))}"</span>`:""}${r.msg?`<span class="vri-val"> — ${e(r.msg)}</span>`:""}</div></div>`;
    }).join("");
  }

  return `<div class="validator-panel">
    <h3>🔗 Webhook Payload Validator</h3>
    <p>Paste the received webhook JSON and select the expected schema to validate all required fields and values.</p>
    <div class="validator-layout">
      <div>
        <div class="field-group">
          <label>Webhook JSON payload</label>
          <textarea class="webhook-textarea" id="webhook-paste" placeholder='Paste webhook JSON here…\n{\n  "ClientOrderId": "OMA123",\n  "OneTimePaymentStatus": "Success",\n  …\n}'>${e(S.valPayload)}</textarea>
        </div>
        <div class="field-group">
          <label>Expected schema</label>
          <select class="val-select" id="val-schema-select">${schemaOpts}</select>
        </div>
        <button class="btn btn-dark validate-btn" onclick="runValidation()">▶ Validate</button>
        <button class="btn btn-sm" style="margin-left:8px" onclick="clearValidation()">✕ Clear</button>
      </div>
      <div>
        <div class="field-group"><label>Validation results</label></div>
        <div class="val-results" id="val-results">${resultsHtml||'<p style="color:var(--text3);font-size:13px">Paste a payload and click Validate to see results.</p>'}</div>
      </div>
    </div>
  </div>`;
}

function attachWebhookEvents(){
  const ta=document.getElementById("webhook-paste");
  const sel=document.getElementById("val-schema-select");
  if(ta) ta.onchange=function(){ S.valPayload=this.value; };
  if(ta) ta.oninput=function(){ S.valPayload=this.value; };
  if(sel) sel.onchange=function(){ S.valSchema=this.value; };
}

function runValidation(){
  S.valPayload=document.getElementById("webhook-paste")?.value||"";
  S.valSchema=document.getElementById("val-schema-select")?.value||"paynow_success";
  let parsed;
  try{ parsed=JSON.parse(S.valPayload); }
  catch(err){ S.valResults=[{status:"fail",label:"JSON parse error",msg:err.message}]; render(); return; }
  const schema=WEBHOOK_SCHEMAS[S.valSchema];
  if(!schema){ S.valResults=[{status:"fail",label:"Unknown schema"}]; render(); return; }
  const results=[];
  schema.required.forEach(field=>{
    const present=parsed.hasOwnProperty(field);
    results.push({status:present?"pass":"fail",label:`Field present: ${field}`,found:present?parsed[field]:undefined,msg:present?"":`Missing required field`});
  });
  schema.checks.forEach(chk=>{
    const val=parsed[chk.field];
    let ok=false;
    if(chk.notEmpty) ok=val!==undefined&&val!==null&&val!=="";
    else if(chk.contains) ok=val!==undefined&&String(val).toLowerCase().includes(String(chk.value).toLowerCase());
    else ok=val===chk.value;
    results.push({status:ok?"pass":"fail",label:chk.label,found:val,msg:ok?"":chk.notEmpty?`Expected non-empty value`:`Expected "${chk.value}", got "${val}"`});
  });
  S.valResults=results;
  render();
}

function clearValidation(){ S.valPayload=""; S.valResults=null; render(); }
function openWebhookForTC(schemaType){ S.view="webhook"; S.valSchema=schemaType; S.valResults=null; render(); }

function setResult(id,val){
  S.results[id]=val;
  saveState();
  if(S.view==="run"){
    const cases=sectionCases(S.activeSection);
    if(S.activeTcIdx<cases.length-1){ setTimeout(()=>{ S.activeTcIdx++; render(); },280); }
  }
  render();
}
function clearResult(id){ delete S.results[id]; delete S.checks[id]; saveState(); render(); }
function setNote(id,val){ S.notes[id]=val; saveState(); }
function toggleExpand(id){ S.expanded[id]=S.expanded[id]===false?true:false; saveState(); render(); }
function prevCase(){ if(S.activeTcIdx>0){ S.activeTcIdx--; saveState(); render(); } }
function nextCase(){ const cases=sectionCases(S.activeSection); if(S.activeTcIdx<cases.length-1){ S.activeTcIdx++; saveState(); render(); } }
function switchSection(id){ S.activeSection=id; S.activeTcIdx=0; S.view="run"; saveState(); render(); }
function setView(v){ S.view=v; saveState(); render(); }

function generateReport(){
  const stats=getOverallStats();
  const env=document.getElementById("env-select")?.value||"Dev";
  const tester=document.getElementById("tester-input")?.value||"—";
  const now=new Date();
  const dateStr=now.toLocaleDateString("en-SG",{day:"2-digit",month:"short",year:"numeric"});
  const timeStr=now.toLocaleTimeString("en-SG",{hour:"2-digit",minute:"2-digit"});
  const fails=allCases().filter(c=>S.results[c.id]==="fail");
  const blockedCases=allCases().filter(c=>S.results[c.id]==="blocked");
  const knownBugHit=fails.filter(c=>c.knownBug);
  const newIssues=fails.filter(c=>!c.knownBug);
  let status="✅ READY FOR DEPLOYMENT";
  if(newIssues.some(c=>["paynow","egiro","mpgs"].includes(c.sectionId))) status="❌ BLOCKED";
  else if(newIssues.length>0||blockedCases.some(c=>["paynow","egiro","mpgs"].includes(c.sectionId))) status="⚠️ ISSUES FOUND";
  else if(blockedCases.length>0) status="⚠️ ISSUES FOUND";

  let r=`===== NTUC REGRESSION RUN REPORT =====\n`;
  r+=`Date        : ${dateStr} ${timeStr}\n`;
  r+=`Tester      : ${tester}\n`;
  r+=`Environment : ${env}\n\n`;
  r+=`SUMMARY\n-------\n`;
  r+=`Total Run   : ${stats.done} / ${stats.total}\n`;
  r+=`Passed      : ${stats.pass}\n`;
  r+=`Failed      : ${stats.fail}\n`;
  r+=`Blocked     : ${stats.blocked}\n`;
  r+=`Skipped     : ${stats.skip}\n\n`;

  TEST_DATA.sections.forEach(sec=>{
    const ss=getSectionStats(sec.id);
    r+=`${sec.name.padEnd(20)}: ${ss.pass}P ${ss.fail}F ${ss.blocked}B ${ss.skip}S / ${ss.total}\n`;
  });
  r+="\n";

  if(fails.length>0){
    r+=`FAILURES\n--------\n`;
    fails.forEach(c=>{
      r+=`[${c.sectionName}] ${c.id} — ${c.scenario}\n`;
      if(S.notes[c.id]) r+=`  Deviation : ${S.notes[c.id]}\n`;
      if(c.knownBug) r+=`  Known bug : ${c.knownBug}\n`;
      r+="\n";
    });
  }

  if(blockedCases.length>0){
    r+=`BLOCKED\n-------\n`;
    blockedCases.forEach(c=>{
      r+=`[${c.sectionName}] ${c.id} — ${c.scenario}\n`;
      if(S.notes[c.id]) r+=`  Reason    : ${S.notes[c.id]}\n`;
    });
    r+="\n";
  }

  if(knownBugHit.length>0){
    r+=`KNOWN BUGS ENCOUNTERED\n----------------------\n`;
    knownBugHit.forEach(c=>{ r+=`• ${c.id}: ${c.knownBug}\n`; });
    r+="\n";
  }

  if(newIssues.length>0){
    r+=`NEW ISSUES ⚠️\n-------------\n`;
    newIssues.forEach(c=>{
      r+=`• [${c.sectionName}] ${c.id} — ${c.scenario}\n`;
      if(S.notes[c.id]) r+=`  Details: ${S.notes[c.id]}\n`;
    });
    r+="\n";
  }

  r+=`OVERALL STATUS: ${status}\n`;
  r+=`=======================================`;
  return {report:r, status};
}

function openReport(){
  const {report,status}=generateReport();
  let pillCls="op-ready", pillTxt="✅ Ready for Deployment";
  if(status.includes("BLOCKED")){ pillCls="op-blocked"; pillTxt="❌ Blocked"; }
  else if(status.includes("ISSUES")){ pillCls="op-issues"; pillTxt="⚠️ Issues Found"; }
  document.getElementById("overall-pill-container").innerHTML=`<div class="overall-pill ${pillCls}">${pillTxt}</div>`;
  document.getElementById("report-content").textContent=report;
  document.getElementById("report-modal").style.display="flex";
}

function closeReport(){ document.getElementById("report-modal").style.display="none"; }

function copyReport(){
  const txt=document.getElementById("report-content").textContent;
  navigator.clipboard.writeText(txt).catch(()=>{});
}

function downloadReport(){
  const txt=document.getElementById("report-content").textContent;
  const env=document.getElementById("env-select")?.value||"Dev";
  const now=new Date();
  const dateStr=now.toISOString().split("T")[0];
  const blob=new Blob([txt],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`NTUC_Regression_${env}_${dateStr}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function render(){
  renderSidebar();
  renderTopbar();
  renderMain();
}

function confirmNewRun() {
  if (confirm("Start a new run? This will clear all current results, notes and checkboxes.")) {
    localStorage.removeItem(LS_KEY);
    S = {
      activeSection: "paynow",
      activeTcIdx: 0,
      view: "run",
      results: {},
      notes: {},
      expanded: {},
      checks: {},
      valPayload: "",
      valSchema: "paynow_success",
      valResults: null
    };
    render();
  }
}

// Show a small persistent indicator that state is saved
function showSaved() {
  const el = document.getElementById("save-indicator");
  if (el) {
    el.style.opacity = "1";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = "0"; }, 1200);
  }
}

render();
</script>
